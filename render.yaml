services:
  - type: web
    name: nucleo-digital-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YCLOUD_API_KEY
        sync: false
      - key: YCLOUD_WEBHOOK_SECRET
        sync: false
      - key: YCLOUD_PHONE_NUMBER
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
